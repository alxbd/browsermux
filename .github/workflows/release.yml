name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The annotated tag object carries the release notes (see below). Plain checkout
          # only fetches the commit, so the message would be unreadable.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Extract version from tag (v1.2.3 -> 1.2.3)
      - name: Set version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_ENV
          pwsh scripts/set-version.ps1 -Version $version

      - name: Restore
        run: msbuild BrowserMux.sln /t:Restore /p:Configuration=Release /p:Platform=x64 /m /nologo /verbosity:minimal

      - name: Build solution
        run: msbuild BrowserMux.sln /t:Build /p:Configuration=Release /p:Platform=x64 /m /nologo /verbosity:minimal

      # PublishAot only activates on dotnet publish, not msbuild /t:Build
      - name: Publish Handler (native AOT)
        run: dotnet publish src/BrowserMux.Handler/BrowserMux.Handler.csproj -c Release -r win-x64 -p:Platform=x64

      # Stage all outputs into out/
      - name: Stage output
        shell: pwsh
        run: |
          $outDir = "out"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Copy App build output (glob the TFM folder so bumping it doesn't break the workflow)
          $appBin = Get-ChildItem "src\BrowserMux.App\bin\x64\Release\net*-windows*" -Directory | Select-Object -First 1
          Copy-Item "$($appBin.FullName)\*" -Destination $outDir -Recurse -Force

          # Overwrite Handler with AOT-published binary
          $handlerPublish = (Get-ChildItem "src\BrowserMux.Handler\bin\x64\Release\net*-windows*\win-x64\publish\BrowserMux.Handler.exe" | Select-Object -First 1).FullName
          Copy-Item $handlerPublish -Destination $outDir -Force

      # Build Inno Setup installer
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc installer/setup.iss

      # Create portable zip
      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path out/* -DestinationPath "dist/BrowserMux-Portable-$env:VERSION.zip"

      # Release notes come from the annotated tag: `git tag -a v1.2.3 -F notes.md`.
      # A lightweight tag has no message, in which case we fall back to GitHub's
      # auto-generated commit list rather than publishing an empty release.
      - name: Read release notes from the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          # Only an annotated tag carries a message. On a lightweight tag `%(contents)`
          # silently returns the tagged COMMIT's message, which is not what we want to
          # publish, so check the object type first.
          $type = (git cat-file -t $tag 2>$null)
          $notes = if ($type -eq 'tag') { (git tag -l --format='%(contents)' $tag) -join "`n" } else { '' }

          if ($notes.Trim()) {
            $notes | Set-Content release-notes.md -Encoding utf8
            echo "HAS_NOTES=true" >> $env:GITHUB_ENV
            Write-Host "Using release notes from the annotated tag ($($notes.Length) chars)."
          } else {
            echo "HAS_NOTES=false" >> $env:GITHUB_ENV
            Write-Host "::warning::Tag $tag has no message ($type), falling back to auto-generated notes."
          }

      # Publish GitHub Release with both assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ env.HAS_NOTES == 'true' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ env.HAS_NOTES != 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/BrowserMux-Setup-*.exe
            dist/BrowserMux-Portable-*.zip

      # ── Code signing (uncomment when you have a certificate) ──
      # - name: Sign binaries
      #   run: |
      #     $cert = [System.Convert]::FromBase64String("${{ secrets.CODE_SIGN_CERT }}")
      #     [System.IO.File]::WriteAllBytes("cert.pfx", $cert)
      #     signtool sign /f cert.pfx /p "${{ secrets.CODE_SIGN_PASSWORD }}" /tr http://timestamp.sectigo.com /td sha256 /fd sha256 out/BrowserMux.exe out/BrowserMux.Handler.exe
      #     Remove-Item cert.pfx
